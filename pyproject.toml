[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qalqan-voice"
version = "0.1.0"
description = "Real-time AI voice deepfake detector for Kazakh, Russian, and code-switched speech."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "torch>=2.2.0",
    "aiogram>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
onnx = [
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
]

[project.scripts]
qalqan-api = "qalqan.api.app:main"
qalqan-bot = "qalqan.bot.telegram_bot:main"
qalqan-train = "qalqan.ml.train:main"

[tool.setuptools.packages.find]
include = ["qalqan*", "scripts*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"
